<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none">
  <title>LeafCheck plant disease identification workflow</title>
  <desc>Upload a leaf photo, identify the plant and assess leaf health with the Plant.id API, then review plant and disease matches.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="0" x2="1090" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F8EF"/>
      <stop offset="1" stop-color="#F8FAF5"/>
    </linearGradient>
    <linearGradient id="leaf" x1="190" y1="142" x2="299" y2="274" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DCB76"/>
      <stop offset="1" stop-color="#3D8753"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="28" fill="url(#background)" stroke="#DDE9DA" stroke-width="2"/>
  <circle cx="1095" cy="79" r="95" fill="#E5F0E2"/>
  <circle cx="76" cy="384" r="78" fill="#E9F2E6"/>
  <text x="64" y="74" fill="#397348" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">PLANT HEALTH, MADE CLEARER</text>
  <text x="64" y="119" fill="#1D3325" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">From leaf photo to plant insight</text>
  <text x="64" y="151" fill="#607064" font-family="Arial, Helvetica, sans-serif" font-size="16">A simple way to identify plants and screen for possible leaf diseases.</text>

  <rect x="63" y="192" width="310" height="178" rx="20" fill="#FFFFFF" stroke="#DCE8D9" stroke-width="2"/>
  <rect x="83" y="212" width="88" height="88" rx="16" fill="#EDF6E9"/>
  <path d="M101 277C103 246 125 227 154 229C153 258 137 280 101 277Z" fill="url(#leaf)"/>
  <path d="M102 278C118 260 132 246 151 232" stroke="#E4F2DE" stroke-width="3" stroke-linecap="round"/>
  <path d="M119 263L115 247M131 250L132 237M125 257L143 260" stroke="#D1E8C9" stroke-width="2.4" stroke-linecap="round"/>
  <text x="190" y="243" fill="#243A2B" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">1. Add a leaf photo</text>
  <text x="190" y="270" fill="#6B796E" font-family="Arial, Helvetica, sans-serif" font-size="14">Choose, drag, or paste</text>
  <text x="190" y="291" fill="#6B796E" font-family="Arial, Helvetica, sans-serif" font-size="14">a clear image.</text>
  <rect x="83" y="322" width="267" height="29" rx="9" fill="#F4F7F2"/>
  <text x="98" y="342" fill="#637166" font-family="Arial, Helvetica, sans-serif" font-size="12">JPG · PNG · WEBP</text>

  <path d="M393 278H458" stroke="#7BA981" stroke-width="3" stroke-linecap="round"/>
  <path d="M449 268L460 278L449 288" stroke="#7BA981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="478" y="192" width="290" height="178" rx="20" fill="#FFFFFF" stroke="#DCE8D9" stroke-width="2"/>
  <circle cx="523" cy="257" r="23" fill="#EAF4E7"/>
  <path d="M512 258L520 266L535 248" stroke="#438253" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="561" y="243" fill="#243A2B" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">2. Analyze with</text>
  <text x="561" y="269" fill="#397348" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Plant.id</text>
  <text x="502" y="316" fill="#6B796E" font-family="Arial, Helvetica, sans-serif" font-size="14">Plant identification + health check</text>
  <text x="502" y="339" fill="#6B796E" font-family="Arial, Helvetica, sans-serif" font-size="14">including grape and many more.</text>

  <path d="M788 278H853" stroke="#7BA981" stroke-width="3" stroke-linecap="round"/>
  <path d="M844 268L855 278L844 288" stroke="#7BA981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="873" y="192" width="264" height="178" rx="20" fill="#FFFFFF" stroke="#DCE8D9" stroke-width="2"/>
  <text x="898" y="232" fill="#243A2B" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">3. Review matches</text>
  <rect x="898" y="250" width="214" height="43" rx="11" fill="#F2F7EF"/>
  <circle cx="917" cy="271" r="7" fill="#63A16B"/>
  <text x="934" y="276" fill="#425548" font-family="Arial, Helvetica, sans-serif" font-size="14">Plant name + species</text>
  <rect x="898" y="304" width="214" height="43" rx="11" fill="#FFF6E8"/>
  <circle cx="917" cy="325" r="7" fill="#D99A42"/>
  <text x="934" y="330" fill="#66543B" font-family="Arial, Helvetica, sans-serif" font-size="14">Health and disease results</text>

  <text x="64" y="411" fill="#718075" font-family="Arial, Helvetica, sans-serif" font-size="12">Screening aid only · Results are estimates, not a confirmed diagnosis</text>
</svg>
